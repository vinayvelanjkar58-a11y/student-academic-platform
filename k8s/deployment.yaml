apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-academic-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-academic-platform
  template:
    metadata:
      labels:
        app: student-academic-platform
    spec:
      containers:
        - name: student-academic-platform
          image: docker.io/library/student-academic-platform:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: student-academic-platform
spec:
  type: NodePort
  selector:
    app: student-academic-platform
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30050
